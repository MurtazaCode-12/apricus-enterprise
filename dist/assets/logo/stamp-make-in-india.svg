<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lion Gear Silhouette Graphic -->
  <g transform="translate(15, 10) scale(0.65)">
    <!-- Body Gears -->
    <path fill="#ffffff" d="M120,40 C110,35 100,25 85,25 C70,25 60,35 50,45 C40,40 30,45 25,55 C15,55 10,65 15,75 C10,85 15,95 25,100 C30,110 40,115 50,110 C60,120 75,120 85,115 C95,120 110,120 120,110 C130,115 140,110 145,100 C155,95 160,85 155,75 C160,65 155,55 145,55 C140,45 130,40 120,40 Z" opacity="0.95"/>
    
    <!-- Gear Teeth Accents -->
    <circle cx="85" cy="70" r="18" fill="url(#cyanGrad)" />
    <circle cx="85" cy="70" r="8" fill="#040714" />
    
    <circle cx="125" cy="70" r="14" fill="url(#cyanGrad)" opacity="0.8"/>
    <circle cx="125" cy="70" r="6" fill="#040714" />

    <circle cx="50" cy="75" r="12" fill="url(#cyanGrad)" opacity="0.8"/>
    <circle cx="50" cy="75" r="5" fill="#040714" />
    
    <!-- Lion Tail & Details -->
    <path d="M150,80 Q180,70 190,40 Q195,30 185,25 Q175,30 180,45 Z" fill="url(#cyanGrad)"/>
    
    <!-- Legs -->
    <rect x="45" y="105" width="10" height="25" rx="3" fill="#ffffff"/>
    <rect x="70" y="108" width="10" height="22" rx="3" fill="#ffffff"/>
    <rect x="100" y="108" width="10" height="22" rx="3" fill="#ffffff"/>
    <rect x="125" y="105" width="10" height="25" rx="3" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="145" y="52" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">MAKE IN INDIA</text>
  <text x="145" y="74" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#06b6d4" letter-spacing="3.5">GOVT. OF INDIA</text>
  <line x1="145" y1="84" x2="295" y2="84" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>